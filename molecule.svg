<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Внешний куб: сильная перспектива (задняя грань сдвинута вправо на 40, вверх на 20) -->
  <g stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity="0.95">
    <!-- Передняя грань: TFL→TFR→BFR→BFL -->
    <line x1="25" y1="85" x2="105" y2="85"/>
    <line x1="105" y1="85" x2="105" y2="165"/>
    <line x1="105" y1="165" x2="25" y2="165"/>
    <line x1="25" y1="165" x2="25" y2="85"/>
    <!-- Задняя грань: TBL→TBR→BBR→BBL -->
    <line x1="65" y1="65" x2="145" y2="65"/>
    <line x1="145" y1="65" x2="145" y2="145"/>
    <line x1="145" y1="145" x2="65" y2="145"/>
    <line x1="65" y1="145" x2="65" y2="65"/>
    <!-- Соединительные рёбра -->
    <line x1="25" y1="85" x2="65" y2="65"/>
    <line x1="105" y1="85" x2="145" y2="65"/>
    <line x1="25" y1="165" x2="65" y2="145"/>
    <line x1="105" y1="165" x2="145" y2="145"/>
  </g>

  <!-- Внутренний тетраэдр в нижне-левом квадранте куба -->
  <g stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
    <line x1="72" y1="108" x2="48" y2="135"/>
    <line x1="72" y1="108" x2="78" y2="137"/>
    <line x1="72" y1="108" x2="62" y2="150"/>
    <line x1="48" y1="135" x2="78" y2="137"/>
    <line x1="48" y1="135" x2="62" y2="150"/>
    <line x1="78" y1="137" x2="62" y2="150"/>
  </g>

  <!-- 4 длинные диагонали от внешних углов к атомам тетраэдра -->
  <g stroke="currentColor" stroke-width="2.2" stroke-linecap="round" opacity="0.65">
    <line x1="65" y1="65" x2="72" y2="108"/>
    <line x1="145" y1="65" x2="72" y2="108"/>
    <line x1="25" y1="165" x2="48" y2="135"/>
    <line x1="105" y1="165" x2="78" y2="137"/>
  </g>

  <!-- 8 внешних атомов -->
  <g fill="currentColor">
    <circle cx="25" cy="85" r="6"/>
    <circle cx="105" cy="85" r="6"/>
    <circle cx="25" cy="165" r="6"/>
    <circle cx="105" cy="165" r="6"/>
    <circle cx="65" cy="65" r="6"/>
    <circle cx="145" cy="65" r="6"/>
    <circle cx="65" cy="145" r="6"/>
    <circle cx="145" cy="145" r="6"/>
  </g>

  <!-- 4 атома внутреннего тетраэдра -->
  <g fill="currentColor">
    <circle cx="72" cy="108" r="4.5"/>
    <circle cx="48" cy="135" r="4.5"/>
    <circle cx="78" cy="137" r="4.5"/>
    <circle cx="62" cy="150" r="4.5"/>
  </g>
</svg>
