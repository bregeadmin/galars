# После любой правки страниц пересобирает поисковый индекс сайта.
name: search-index
on:
  push:
    branches: [main]
    paths: ['**.html', 'tools/gen-search-index.py']
permissions:
  contents: write
jobs:
  rebuild:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 tools/gen-search-index.py
      - name: commit
        run: |
          git config user.name 'galars-bot'
          git config user.email 'bot@galars.ru'
          if ! git diff --quiet search-index.json; then
            git add search-index.json
            git commit -m 'Поисковый индекс пересобран [skip ci]'
            git push
          fi
